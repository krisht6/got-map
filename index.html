<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Westeros Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #11141a;
      --surface-2: #171b23;
      --line: #232833;
      --text: #e9e6df;
      --muted: #8b909c;
      --faint: #5b616d;
      --gold: #d9b45a;
      --gold-soft: rgba(217, 180, 90, 0.12);
      --red: #c8553d;
      --header-h: 64px;
      --serif: "Cinzel", Georgia, serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* ---------- Header ---------- */

    .header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand span { color: var(--gold); }

    .filters { display: flex; gap: 4px; flex-wrap: wrap; }

    .filter {
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--muted);
      transition: color 0.15s, background 0.15s;
    }

    .filter:hover { color: var(--text); }
    .filter.active { color: var(--gold); background: var(--gold-soft); }

    /* ---------- Layout ---------- */

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      height: calc(100dvh - var(--header-h));
    }

    .map-pane {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-width: 0;
    }

    /* Fixed aspect ratio (matches westeros-map.jpg) so the map never resizes
       and marker percentages always line up with the image. */
    .map-frame {
      position: relative;
      width: min(100%, calc((100dvh - var(--header-h) - 48px) * 1280 / 1707));
      aspect-ratio: 1280 / 1707;
      overflow: hidden;
      border-radius: 12px;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .map-frame.dragging { cursor: grabbing; }

    .map-canvas {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
      background: var(--bg); /* backdrop for the image's screen blend */
      --inv: 1;
    }

    .map-canvas.animate { transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1); }

    /* Source image is black lines on white: invert it, then screen-blend so
       the black drops out and only faint lines remain on the page background. */
    .map-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: invert(1) sepia(0.5) brightness(0.62);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .region-label {
      position: absolute;
      transform: translate(-50%, -50%) scale(var(--inv));
      font-family: var(--serif);
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--faint);
      white-space: nowrap;
      pointer-events: none;
    }

    .map-controls {
      position: absolute;
      right: 12px;
      top: 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 20, 26, 0.9);
      overflow: hidden;
      z-index: 5;
    }

    .map-controls button {
      width: 32px;
      height: 32px;
      color: var(--muted);
      font-size: 16px;
    }

    .map-controls button + button { border-top: 1px solid var(--line); }
    .map-controls button:hover { color: var(--text); background: var(--surface-2); }

    /* ---------- Markers ---------- */

    .marker {
      position: absolute;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%) scale(var(--inv));
      display: grid;
      place-items: center;
      z-index: 2;
    }

    .marker .pin {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(217, 180, 90, 0.18);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .marker[data-type="battle"] .pin { background: var(--red); box-shadow: 0 0 0 3px rgba(200, 85, 61, 0.2); }
    .marker[data-type="city"] .pin { background: #9fb4d8; box-shadow: 0 0 0 3px rgba(159, 180, 216, 0.18); }
    .marker.offmap .pin { background: transparent; border: 1.5px dashed var(--gold); }

    .marker .name {
      position: absolute;
      left: 50%;
      bottom: 100%;
      transform: translateX(-50%);
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(10, 12, 16, 0.92);
      border: 1px solid var(--line);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .marker:hover { z-index: 3; }
    .marker:hover .pin { transform: scale(1.3); }
    .marker:hover .name,
    .marker.selected .name { opacity: 1; }

    .marker.selected { z-index: 4; }
    .marker.selected .pin {
      transform: scale(1.4);
      box-shadow: 0 0 0 4px rgba(10, 12, 16, 0.9), 0 0 0 5.5px currentColor;
      color: var(--gold);
    }

    .marker.dim { opacity: 0.15; pointer-events: none; }

    /* ---------- Side panel ---------- */

    .panel {
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--surface);
    }

    .detail {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 24px;
      min-height: 0;
    }

    .detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .tag[data-type="battle"] { color: var(--red); }
    .tag[data-type="city"] { color: #9fb4d8; }

    .stepper { display: flex; gap: 2px; }

    .stepper button {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: var(--muted);
    }

    .stepper button:hover { background: var(--surface-2); color: var(--text); }

    .detail h1 {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .region { color: var(--muted); margin-top: 2px; }

    .summary {
      margin-top: 16px;
      color: #c9c6bf;
      line-height: 1.65;
    }

    .facts {
      margin-top: 20px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 16px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .facts dt { color: var(--faint); }
    .facts dd { color: var(--text); }

    .section-title {
      margin: 22px 0 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .timeline { list-style: none; }

    .timeline li {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 10px;
      padding: 8px 0;
      font-size: 13px;
      color: #c9c6bf;
    }

    .timeline li + li { border-top: 1px solid rgba(35, 40, 51, 0.6); }

    .ep {
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--gold);
      padding-top: 1px;
    }

    .people { display: flex; flex-wrap: wrap; gap: 6px; }

    .person {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: #c9c6bf;
    }

    .trivia {
      margin-top: 22px;
      padding: 12px 14px;
      border-left: 2px solid var(--gold);
      background: var(--gold-soft);
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      color: #d8d2c3;
    }

    .trivia strong { color: var(--gold); font-weight: 600; }

    .spoiler { margin-top: 18px; font-size: 11px; color: var(--faint); }

    /* ---------- Location list ---------- */

    .list-wrap {
      flex: 0 0 auto;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      height: 38%;
      min-height: 200px;
    }

    .search {
      margin: 12px 16px 6px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .search:focus { border-color: rgba(217, 180, 90, 0.5); }

    .list { overflow-y: auto; padding: 0 8px 12px; }

    .list-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      text-align: left;
      font-size: 13px;
    }

    .list-item:hover { background: var(--surface-2); }
    .list-item.active { background: var(--gold-soft); }
    .list-item.active .li-name { color: var(--gold); }

    .li-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; }
    .li-dot[data-type="battle"] { background: var(--red); }
    .li-dot[data-type="city"] { background: #9fb4d8; }
    .li-name { flex: 1; }
    .li-region { color: var(--faint); font-size: 12px; }

    .empty { color: var(--faint); padding: 12px 10px; font-size: 13px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

    /* ---------- Mobile ---------- */

    @media (max-width: 900px) {
      .header { height: auto; padding: 14px 16px; flex-direction: column; align-items: flex-start; gap: 10px; }
      .layout { grid-template-columns: minmax(0, 1fr); height: auto; }
      .map-pane { padding: 16px; }
      .map-frame { width: 100%; }
      .panel { border-left: 0; border-top: 1px solid var(--line); }
      .detail { overflow: visible; padding: 20px 16px; }
      .list-wrap { height: auto; }
      .list { max-height: 320px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">Westeros <span>Atlas</span></div>
    <nav class="filters" id="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="seat">Seats</button>
      <button class="filter" data-filter="battle">Battles</button>
      <button class="filter" data-filter="city">Cities</button>

  <main class="layout">
    <section class="map-pane">

        <div class="map-controls">
          <button id="zoom-in" title="Zoom in">+</button>
          <button id="zoom-out" title="Zoom out">−</button>
          <button id="zoom-reset" title="Reset view">⤢</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <article class="detail" id="detail"></article>
      <div class="list-wrap">
        <input class="search" id="search" type="search" placeholder="Search locations…" autocomplete="off" />
        <div class="list" id="list"></div>
      </div>
    </aside>
  </main>

        type: "seat",
        x: 29, y: 85,
        summary: "Seat of House Tyrell in the fertile Reach, the breadbasket of the Seven Kingdoms. The Tyrells' grain and gold keep the capital fed.",
        facts: { "House": "Tyrell", "Words": "\"Growing Strong\"", "First seen": "Season 7" },
        events: [
          ["S7E3", "Jaime's army takes Highgarden in a swift strike."],
          ["S7E3", "Olenna drinks poison and confesses to Jaime that she killed Joffrey."],
        ],
        people: ["Olenna Tyrell", "Margaery Tyrell", "Loras Tyrell", "Mace Tyrell"],
        trivia: "\"Tell Cersei. I want her to know it was me.\" — Olenna's last line.",
      },
      {
        id: "oldtown",
        name: "Oldtown",
        region: "The Reach",
        type: "city",
        x: 21, y: 89,
        summary: "The oldest city in Westeros and home of the Citadel, where maesters are trained and the realm's knowledge is kept.",
        facts: { "Landmark": "The Citadel", "First seen": "Season 6, Episode 10" },
        events: [
          ["S6E10", "Sam arrives with Gilly and Little Sam and enters the great library."],
          ["S7", "Sam secretly cures Jorah Mormont's greyscale."],
          ["S7", "Sam finds the record of Rhaegar's annulment, a clue to Jon's parentage."],
        ],
        people: ["Samwell Tarly", "Gilly", "Archmaester Ebrose", "Jorah Mormont"],
        trivia: "The Citadel library set took inspiration from the Strahov Monastery in Prague.",
      },
      {
        id: "storms-end",
        name: "Storm's End",
        region: "The Stormlands",
        type: "seat",
        x: 50.5, y: 83.5,
        summary: "Seat of House Baratheon, raised on Shipbreaker Bay with walls built to survive the storms that wrecked six earlier castles.",
        facts: { "House": "Baratheon", "Words": "\"Ours Is the Fury\"", "First seen": "Mentioned only" },
        events: [
          ["S2E4", "Melisandre gives birth to a shadow beneath the castle walls."],

        ],

      },
      {
        id: "sunspear",
        name: "Sunspear",
        region: "Dorne",
        type: "seat",
        x: 62, y: 94,
        summary: "Seat of House Martell on the eastern coast of Dorne — the only kingdom never conquered by Targaryen dragons.",
        facts: { "House": "Martell", "Words": "\"Unbowed, Unbent, Unbroken\"", "First seen": "Season 5" },
        events: [
          ["S5", "Jaime and Bronn sneak into Dorne to bring Myrcella home."],
          ["S5E10", "Ellaria Sand poisons Myrcella with a farewell kiss."],
          ["S6E1", "Ellaria murders Prince Doran and seizes power."],
        ],
        people: ["Doran Martell", "Ellaria Sand", "Oberyn Martell", "The Sand Snakes", "Myrcella Baratheon"],
        trivia: "The Water Gardens were filmed at the Real Alcázar in Seville.",
      },
      {
        id: "braavos",
        name: "Braavos",
        region: "The Free Cities, Essos",
        type: "city",
        x: 67, y: 63,
        summary: "A city of canals founded by escaped slaves, guarded by the giant Titan and home to the Iron Bank and the Faceless Men.",
        facts: { "Landmarks": "Titan of Braavos, Iron Bank, House of Black and White", "First seen": "Season 4" },
        events: [
          ["S4E6", "Stannis and Davos persuade the Iron Bank to fund their war."],
          ["S5E2", "Arya arrives and is taken in at the House of Black and White."],
          ["S5E10", "Arya kills Meryn Trant and is blinded as punishment."],
          ["S6E8", "Arya defeats the Waif and declares herself Arya Stark of Winterfell."],
        ],
        people: ["Arya Stark", "Jaqen H'ghar", "The Waif", "Tycho Nestoris", "Syrio Forel"],
        trivia: "Syrio Forel, Arya's \"dancing master\", was the First Sword of Braavos.",
      },
      {
        id: "meereen",
        name: "Meereen",
        region: "Slaver's Bay, Essos (off map)",
        type: "city",
        offmap: true,
        x: 96, y: 88,
        summary: "The greatest of the slave cities, topped by a vast bronze harpy. Daenerys conquers it and stays to learn how to rule.",
        facts: { "Ruled by": "Daenerys Targaryen (S4–S6)", "First seen": "Season 4" },
        events: [
          ["S4E3", "Daenerys sends broken chains over the walls and the slaves rise."],
          ["S4E10", "Unable to control them, Dany chains her dragons in the catacombs."],
          ["S5E9", "Drogon rescues Daenerys from the Sons of the Harpy in Daznak's Pit."],
          ["S6E9", "Daenerys's dragons destroy the masters' fleet."],
        ],
        people: ["Daenerys Targaryen", "Tyrion Lannister", "Missandei", "Grey Worm", "Daario Naharis", "Hizdahr zo Loraq"],
        trivia: "Slaver's Bay lies far to the east, beyond the edge of this map.",
      },
    ];

    // ---------- State ----------
    const frame = document.getElementById("frame");
    const canvas = document.getElementById("canvas");
    const detailEl = document.getElementById("detail");
    const listEl = document.getElementById("list");
    const searchEl = document.getElementById("search");

    let selectedId = null;
    let activeFilter = "all";
    let query = "";
    const view = { scale: 1, x: 0, y: 0 };
    const MIN_SCALE = 1, MAX_SCALE = 4;

    const isVisible = (poi) =>
      (activeFilter === "all" || poi.type === activeFilter) &&
      (!query || (poi.name + " " + poi.region).toLowerCase().includes(query));

    // ---------- Map ----------
    function buildMap() {
      REGION_LABELS.forEach((r) => {
        const el = document.createElement("div");
        el.className = "region-label";
        el.style.left = r.x + "%";
        el.style.top = r.y + "%";
        el.textContent = r.text;
        canvas.appendChild(el);
      });

      POIS.forEach((poi) => {
        const m = document.createElement("button");
        m.className = "marker" + (poi.offmap ? " offmap" : "");
        m.dataset.id = poi.id;
        m.dataset.type = poi.type;
        m.style.left = poi.x + "%";
        m.style.top = poi.y + "%";
        m.setAttribute("aria-label", poi.name);
        m.innerHTML = `<span class="pin"></span><span class="name">${poi.name}${poi.offmap ? " →" : ""}</span>`;
        m.addEventListener("click", () => select(poi.id, { fly: false }));
        canvas.appendChild(m);
      });
    }

    function syncMarkers() {
      canvas.querySelectorAll(".marker").forEach((m) => {
        const poi = POIS.find((p) => p.id === m.dataset.id);
        m.classList.toggle("selected", poi.id === selectedId);
        m.classList.toggle("dim", !isVisible(poi));
      });
    }

    // ---------- Zoom & pan ----------
    function clampView() {
      const w = frame.clientWidth, h = frame.clientHeight;
      view.scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale));
      view.x = Math.min(0, Math.max(w - w * view.scale, view.x));
      view.y = Math.min(0, Math.max(h - h * view.scale, view.y));
    }

    function applyView(animate = false) {
      clampView();
      canvas.classList.toggle("animate", animate);
      canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
      canvas.style.setProperty("--inv", 1 / view.scale);
    }

    function zoomAt(factor, cx, cy, animate) {
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * factor));
      const k = next / view.scale;
      view.x = cx - (cx - view.x) * k;
      view.y = cy - (cy - view.y) * k;
      view.scale = next;
      applyView(animate);
    }

    function flyTo(poi) {
      const w = frame.clientWidth, h = frame.clientHeight;
      view.scale = Math.max(view.scale, 2);
      view.x = w / 2 - (poi.x / 100) * w * view.scale;
      view.y = h / 2 - (poi.y / 100) * h * view.scale;
      applyView(true);
    }

    function setupPanZoom() {
      frame.addEventListener("wheel", (e) => {
        e.preventDefault();
        const r = frame.getBoundingClientRect();
        zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top, false);
      }, { passive: false });

      let drag = null;
      frame.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".map-controls")) return;
        drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
      });
      frame.addEventListener("pointermove", (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
        if (!drag.moved && Math.hypot(dx, dy) < 4) return;
        if (!drag.moved) {
          // Only capture once it's a real drag, so plain clicks still reach markers
          drag.moved = true;
          frame.setPointerCapture(e.pointerId);
          frame.classList.add("dragging");
        }
        view.x = drag.vx + dx;
        view.y = drag.vy + dy;
        applyView(false);
      });
      const end = () => { drag = null; frame.classList.remove("dragging"); };
      frame.addEventListener("pointerup", end);
      frame.addEventListener("pointercancel", end);

      const center = () => [frame.clientWidth / 2, frame.clientHeight / 2];
      document.getElementById("zoom-in").onclick = () => zoomAt(1.5, ...center(), true);
      document.getElementById("zoom-out").onclick = () => zoomAt(1 / 1.5, ...center(), true);
      document.getElementById("zoom-reset").onclick = () => {
        Object.assign(view, { scale: 1, x: 0, y: 0 });
        applyView(true);
      };

      window.addEventListener("resize", () => applyView(false));

      // Dev helper: alt-click logs image-relative coordinates for placing markers
      frame.addEventListener("click", (e) => {
        if (!e.altKey) return;
        const r = canvas.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * 100;
        const y = ((e.clientY - r.top) / r.height) * 100;
        console.log(`x: ${x.toFixed(1)}, y: ${y.toFixed(1)}`);
      });
    }

    // ---------- Panel ----------
    function renderDetail(poi) {
      const facts = Object.entries(poi.facts)
        .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`)
        .join("");
      const events = poi.events
        .map(([ep, text]) => `<li><span class="ep">${ep}</span><span>${text}</span></li>`)
        .join("");
      const people = poi.people.map((p) => `<span class="person">${p}</span>`).join("");

      detailEl.innerHTML = `
        <div class="detail-top">
          <span class="tag" data-type="${poi.type}">${TYPES[poi.type]}</span>
          <div class="stepper">
            <button data-step="-1" title="Previous (←)">‹</button>
            <button data-step="1" title="Next (→)">›</button>
          </div>
        </div>
        <h1>${poi.name}</h1>
        <div class="region">${poi.region}</div>
        <p class="summary">${poi.summary}</p>
        <dl class="facts">${facts}</dl>
        <div class="section-title">Key moments</div>
        <ul class="timeline">${events}</ul>
        <div class="section-title">Notable figures</div>
        <div class="people">${people}</div>
        <div class="trivia"><strong>Did you know?</strong> ${poi.trivia}</div>
        <div class="spoiler">Contains spoilers for the HBO series.</div>
      `;
      detailEl.scrollTop = 0;
      detailEl.querySelectorAll("[data-step]").forEach((b) =>
        b.addEventListener("click", () => step(Number(b.dataset.step)))
      );
    }

    function renderList() {
      const visible = POIS.filter(isVisible);
      listEl.innerHTML = visible.length
        ? visible
            .map(
              (p) => `<button class="list-item${p.id === selectedId ? " active" : ""}" data-id="${p.id}">
                <span class="li-dot" data-type="${p.type}"></span>
                <span class="li-name">${p.name}</span>
                <span class="li-region">${p.region.replace(" (off map)", "")}</span>
              </button>`
            )
            .join("")
        : `<div class="empty">No locations match.</div>`;
      listEl.querySelectorAll(".list-item").forEach((el) =>
        el.addEventListener("click", () => select(el.dataset.id, { fly: true }))
      );
    }

    function select(id, { fly = false } = {}) {
      const poi = POIS.find((p) => p.id === id);
      if (!poi) return;
      selectedId = id;
      renderDetail(poi);
      syncMarkers();
      listEl.querySelectorAll(".list-item").forEach((el) =>
        el.classList.toggle("active", el.dataset.id === id)
      );
      if (fly && view.scale > 1) flyTo(poi);
    }

    function step(dir) {
      const visible = POIS.filter(isVisible);
      if (!visible.length) return;
      const i = visible.findIndex((p) => p.id === selectedId);
      const next = visible[(i + dir + visible.length) % visible.length];
      select(next.id, { fly: true });
      listEl.querySelector(`[data-id="${next.id}"]`)?.scrollIntoView({ block: "nearest" });
    }

    function refresh() {
      renderList();
      syncMarkers();
    }

    // ---------- Init ----------
    document.querySelectorAll(".filter").forEach((btn) =>
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        refresh();
      })
    );

    searchEl.addEventListener("input", () => {
      query = searchEl.value.trim().toLowerCase();
      refresh();
    });

    document.addEventListener("keydown", (e) => {
      if (e.target === searchEl) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); step(1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); step(-1); }
    });

    buildMap();
    setupPanZoom();
    applyView();
    renderList();
    select("kings-landing");
  </script>
</body>
